<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Business Card</title>
  <style>
    body {
  background-color: rosybrown;
  font-family: Arial, sans-serif;
}
    .business-card {
  width: 300px;
  background-color: #f5f5dc;
  padding: 20px;
  margin-top: 100px;
  text-align: center;
  font-size: 16px;
  margin-left: auto;
  margin-right: auto;
}
    .profile-image {
  max-width: 100%;
}

p {
  margin-top: 5px;
  margin-bottom: 5px;
}

a {
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}
  </style>
</head>
<body>
  <div class="business-card">
    <img class="profile-image" src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg" alt="A vibrant pink flower in full bloom">
    <p class="full-name">Alex Rivera</p>
    <p class="designation">Full Stack Developer</p>
    <p class="company">TechBloom Solutions</p>
    <hr>
    <p>alex.rivera@techbloom.com</p>
    <p>(555) 123-4567</p>
    <a class="portfolio-link" href="https://www.example.com">Portfolio</a>
    <hr>
    <div class="social-media">
      <h2>Connect with me</h2>
      <a href="https://twitter.com">Twitter</a>
      <a href="https://linkedin.com">LinkedIn</a>
      <a href="https://github.com">GitHub</a>
    </div>
  </div>
</body>
</html>
